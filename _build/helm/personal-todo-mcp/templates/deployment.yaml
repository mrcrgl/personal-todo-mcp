apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "personal-todo-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "personal-todo-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "personal-todo-mcp.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "personal-todo-mcp.selectorLabels" . | nindent 14 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 10080
          env:
            - name: PUBLIC_BASE_URL
              value: {{ required "publicBaseUrl is required" .Values.publicBaseUrl | quote }}
            - name: GH_APP_ID
              value: {{ required "githubApp.id is required" .Values.githubApp.id | quote }}
            - name: GH_APP_SLUG
              value: {{ required "githubApp.slug is required" .Values.githubApp.slug | quote }}
            - name: GH_APP_CLIENT_ID
              value: {{ required "githubApp.clientId is required" .Values.githubApp.clientId | quote }}
            - name: GH_APP_PRIVATE_KEY_PATH
              value: /keys/github-app.pem
            - name: RUST_LOG
              value: {{ .Values.rustLog | quote }}
            - name: TOKEN_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: TOKEN_KEYS
            - name: GH_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: GH_APP_CLIENT_SECRET
          volumeMounts:
            - name: github-app-key
              mountPath: /keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: github-app-key
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: github-app.pem
                path: github-app.pem
