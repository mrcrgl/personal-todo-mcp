[package]
name = "personal-todo-mcp"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Multi-tenant MCP server (streamable HTTP) that manages personal todos as GitHub Issues in a repository you own"
repository = "https://github.com/mrcrgl/personal-todo-mcp"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["form"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
chacha20poly1305 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
subtle = "2"
url = "2"
moka = { version = "0.12", features = ["future"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = "symbols"
